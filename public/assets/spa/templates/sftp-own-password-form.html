<form data-form="ownSftpPassword"
      data-attr="action:form_action"
      method="post"
      data-method="PUT"
      data-ajax-submit="true"
      data-validate="true"
      data-emit-event="phpcp:reload">
  <fieldset>
    <div>
      <label for="own_sftp_password" data-i18n>New SFTP password</label>
      <span class="form-control icon-lock">
        <input type="text" id="own_sftp_password" name="password" required minlength="12"
               autocomplete="off" spellcheck="false" data-attr="value:suggested_password">
      </span>
      <div class="flex middle gap-4">
        <button type="button" class="btn small icon-refresh" data-action="click.prevent:suggestPassword"
                data-password-target="own_sftp_password" data-i18n>Generate a new one</button>
        <button type="button" class="btn small icon-copy" data-action="click.prevent:copyField"
                data-copy-target="own_sftp_password" data-i18n>Copy</button>
      </div>
      <div class="comment" data-i18n>At least 12 characters. This is separate from your panel password — it is what SFTP programs ask for.</div>
    </div>
  </fieldset>
  <fieldset class="submit">
    <button type="submit" class="btn btn-primary icon-save" data-i18n>Change SFTP password</button>
  </fieldset>
</form>
