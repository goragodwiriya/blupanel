<aside data-component="sidebar"></aside>
<div class="main-content">
  <header data-component="topbar"></header>
  <div data-component="mode-banner"></div>
  <div data-component="rollback-bar"></div>
  <main class="content" data-script="pageLogs">
    <div class="card-groups">
      <header>
        <div>
          <h1 class="icon-list" data-i18n>Logs</h1>
          <p data-i18n>Read the tail of any log source this account may see</p>
        </div>
        <div class="table_nav">
          <label for="log_refresh" data-i18n>Auto refresh</label>
          <span class="form-control icon-refresh">
            <select id="log_refresh" data-log-refresh>
              <option value="0" data-i18n>Off</option>
              <option value="5" data-i18n>5 {LNG_seconds}</option>
              <option value="10" data-i18n>10 {LNG_seconds}</option>
              <option value="30" data-i18n>30 {LNG_seconds}</option>
            </select>
          </span>
          <span class="text-muted" data-log-updated hidden></span>
        </div>
      </header>
      <div class="content-body">
        <div class="tablebody">
          <form class="table_nav" data-log-form>
            <div>
              <label for="log_source" data-i18n>Source</label>
              <span class="form-control icon-list" data-component="api" data-endpoint="/api/v2/logs/sources">
                <select id="log_source" name="source" data-for="src in data">
                  <template>
                    <option data-attr="value:src.key" data-text="src.label"></option>
                  </template>
                </select>
              </span>
            </div>
            <div>
              <label for="pageSize" data-i18n>Lines</label>
              <span class="form-control">
                <select id="pageSize" name="pageSize">
                  <option value="10" data-i18n>10 {LNG_entries}</option>
                  <option value="20" data-i18n>20 {LNG_entries}</option>
                  <option value="50" data-i18n>50 {LNG_entries}</option>
                  <option value="100" data-i18n>100 {LNG_entries}</option>
                  <option value="200" data-i18n>200 {LNG_entries}</option>
                  <option value="500" data-i18n>500 {LNG_entries}</option>
                  <option value="1000" data-i18n>1,000 {LNG_entries}</option>
                  <option value="1500" data-i18n>1,500 {LNG_entries}</option>
                  <option value="2000" data-i18n>2,000 {LNG_entries}</option>
                </select>
              </span>
            </div>
            <input type="search" name="q" placeholder="{LNG_Search}...">
          </form>
          <div class="log-tail" data-log-tail>
            <div class="log-tail-head" aria-hidden="true">
              <span data-i18n>{LNG_Line}</span>
              <span data-i18n>{LNG_Level}</span>
              <span data-i18n>{LNG_Message}</span>
            </div>
            <div class="log-tail-lines" data-log-lines aria-busy="true"></div>
            <p class="log-tail-empty text-muted" data-log-empty hidden data-i18n>No log lines found</p>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
