<!--
  ฟอร์มเพิ่มโดเมนให้เว็บไซต์ — คนละเทมเพลตกับตารางตาม FRAMEWORK_GUIDE Pattern 3

  สองช่องกรอกถือว่าน้อย จึงเปิดใน Modal ตามคำสั่งที่มากับคำตอบของ API
  ปลายทางมาจากคำตอบ (`form_action`) เพราะขึ้นกับว่ากำลังดูเว็บไหนอยู่

  ไม่มีฟอร์มแก้ไขคู่กัน — โดเมนที่ผูกไว้แล้วลบแล้วเพิ่มใหม่ ไม่ได้แก้ที่อยู่เดิม
-->
<form data-form="siteDomainAdd"
      data-attr="action:form_action"
      method="post"
      data-ajax-submit="true"
      data-validate="true">
  <fieldset>
    <div>
      <label for="new_host" data-i18n>Domain</label>
      <span class="form-control icon-link">
        <input type="text" id="new_host" name="host" required maxlength="253"
               placeholder="sub.example.com {LNG_or} *.example.com"
               autocomplete="off" data-attr="value:host">
      </span>
      <!--
        คำเตือนต้องอยู่ตรงนี้ ไม่ใช่หลังกดเพิ่ม (เฟส E7) — `*.example.com` แปลว่า
        subdomain ที่ยังไม่มีใครจดก็เข้าเว็บนี้ได้ ซึ่งเป็นการตัดสินใจด้านความปลอดภัย
        ที่ผู้ดูแลต้องรู้ก่อนกด ไม่ใช่รู้ตอนที่มีคนใช้ชื่อที่ไม่ได้ตั้งใจเข้ามาแล้ว
      -->
      <div class="comment" data-i18n>Wildcard (*.example.com) accepts every subdomain that is not defined elsewhere, including ones nobody registered. It needs a DNS zone on this server and is verified through DNS, not HTTP.</div>
    </div>
    <div>
      <label for="new_path" data-i18n>Path</label>
      <span class="form-control icon-folder">
        <input type="text" id="new_path" name="path" maxlength="253"
               placeholder="/shop {LNG_or leave blank If you want to use it as Alias}"
               autocomplete="off" data-attr="value:path">
      </span>
    </div>
  </fieldset>
  <fieldset class="submit right">
    <button type="submit" class="btn btn-primary icon-save" data-i18n>Add</button>
  </fieldset>
</form>
