<div class="fm" data-script="pageFileManager">
  <header class="fm-toolbar">
    <div class="fm-toolbar-row">
      <a class="btn icon-arrow-left fm-back" href="/app" data-route="/" data-i18n>Panel</a>
      <span class="form-control icon-folder fm-scope">
        <select data-fm-root aria-label="File scope"></select>
      </span>
      <button type="button" class="btn icon-up" data-fm-up data-tip="Up one level"></button>
      <button type="button" class="btn icon-refresh" data-fm-reload data-tip="Refresh"></button>
      <span class="form-control icon-search fm-find">
        <input type="search" data-fm-search data-tip="Search in this folder">
      </span>
      <span class="fm-views">
        <button type="button" class="btn icon-listview" data-fm-view="list" data-tip="List view"></button>
        <button type="button" class="btn icon-thumbnail" data-fm-view="grid" data-tip="Grid view"></button>
      </span>
    </div>
    <nav class="fm-crumbs" data-fm-crumbs aria-label="Breadcrumb"></nav>
    <div class="fm-commands" data-fm-commands>
      <button type="button" class="btn btn-primary icon-create-folder" data-fm-do="mkdir" data-fm-need="write" data-i18n>New folder</button>
      <button type="button" class="btn icon-new" data-fm-do="touch" data-fm-need="write" data-i18n>New file</button>
      <button type="button" class="btn icon-upload" data-fm-do="upload" data-fm-need="write" data-i18n>Upload</button>
      <span class="fm-sep"></span>
      <button type="button" class="btn icon-download" data-fm-do="download" data-fm-need="one-file" data-i18n>Download</button>
      <button type="button" class="btn icon-edit" data-fm-do="rename" data-fm-need="one" data-i18n>Rename</button>
      <button type="button" class="btn icon-copy" data-fm-do="copy" data-fm-need="any" data-i18n>Copy</button>
      <button type="button" class="btn icon-cut" data-fm-do="cut" data-fm-need="any" data-i18n>Cut</button>
      <button type="button" class="btn icon-import" data-fm-do="paste" data-fm-need="clipboard" data-i18n>Paste</button>
      <span class="fm-sep"></span>
      <button type="button" class="btn icon-zip" data-fm-do="zip" data-fm-need="any" data-i18n>Compress</button>
      <button type="button" class="btn icon-unzip" data-fm-do="unzip" data-fm-need="archive" data-i18n>Extract</button>
      <button type="button" class="btn icon-lock" data-fm-do="chmod" data-fm-need="one" data-i18n>Permissions</button>
      <button type="button" class="btn icon-info" data-fm-do="info" data-fm-need="one" data-i18n>Properties</button>
      <span class="fm-sep"></span>
      <button type="button" class="btn btn-danger icon-delete" data-fm-do="delete" data-fm-need="any" data-i18n>Delete</button>
    </div>
  </header>
  <div class="fm-body">
    <aside class="fm-tree" data-fm-tree aria-label="Folders"></aside>
    <section class="fm-pane" data-fm-pane tabindex="0" aria-label="Files"></section>
  </div>
  <footer class="fm-status">
    <span data-fm-count></span>
    <span data-fm-pager class="fm-pager"></span>
    <span data-fm-disk class="fm-disk"></span>
  </footer>
  <div class="fm-modal" data-fm-modal hidden>
    <div class="fm-modal-card" role="dialog" aria-modal="true">
      <header class="fm-modal-head">
        <h2 data-fm-modal-title></h2>
        <button type="button" class="btn icon-invalid" data-fm-modal-close data-tip="Close"></button>
      </header>
      <div class="fm-modal-body" data-fm-modal-body></div>
      <footer class="fm-modal-foot" data-fm-modal-foot></footer>
    </div>
  </div>
  <ul class="fm-context" data-fm-context hidden></ul>
  <div class="fm-drop" data-fm-drop hidden>
    <span data-i18n>Drop files here to upload</span>
  </div>
</div>
