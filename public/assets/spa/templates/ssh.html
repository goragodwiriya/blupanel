<aside data-component="sidebar"></aside>
<div class="main-content">
  <header data-component="topbar"></header>
  <div data-component="mode-banner"></div>
  <div data-component="rollback-bar"></div>
  <main class="content">
    <div class="card-groups">
      <header>
        <div>
          <h1 class="icon-keyboard" data-i18n>SSH</h1>
          <p data-i18n>sshd settings — changes roll back automatically unless confirmed</p>
        </div>
      </header>
      <div class="content-body">
        <form data-form="sshConfig" action="/api/v2/ssh-config" method="post" data-method="PATCH" data-ajax-submit="true" data-load-api="/api/v2/ssh-config"
              data-confirm="Changing sshd settings can lock you out. The change rolls back automatically unless you confirm it.">
          <fieldset class="notice notice-warning" data-if="warnings.length > 0">
            <legend class="icon-warning" data-i18n>Warnings</legend>
            <ul data-for="warning in warnings">
              <template>
                <li data-text="warning"></li>
              </template>
            </ul>
          </fieldset>
          <fieldset>
            <div class="form-group">
              <div class="width50">
                <label for="ssh_port" data-i18n>Port</label>
                <span class="form-control icon-number">
                  <input type="number" id="ssh_port" name="Port" min="1" max="65535" autocomplete="off" data-attr="value:values.Port.value">
                </span>
              </div>
              <div class="width50">
                <label for="ssh_permit_root">PermitRootLogin</label>
                <span class="form-control icon-shield">
                  <select id="ssh_permit_root" name="PermitRootLogin" data-attr="value:values.PermitRootLogin.value">
                    <option value="no">no</option>
                    <option value="prohibit-password">prohibit-password</option>
                    <option value="yes">yes</option>
                  </select>
                </span>
              </div>
            </div>
            <div class="form-group">
              <div class="width50">
                <label for="ssh_password_auth">PasswordAuthentication</label>
                <span class="form-control icon-password">
                  <select id="ssh_password_auth" name="PasswordAuthentication" data-attr="value:values.PasswordAuthentication.value">
                    <option value="no">no</option>
                    <option value="yes">yes</option>
                  </select>
                </span>
              </div>
              <div class="width50">
                <label for="ssh_pubkey_auth">PubkeyAuthentication</label>
                <span class="form-control icon-shield">
                  <select id="ssh_pubkey_auth" name="PubkeyAuthentication" data-attr="value:values.PubkeyAuthentication.value">
                    <option value="yes">yes</option>
                    <option value="no">no</option>
                  </select>
                </span>
              </div>
            </div>
          </fieldset>
          <fieldset class="submit" data-if="can['manage']">
            <button type="submit" class="btn btn-primary icon-save" data-i18n>Save</button>
          </fieldset>
        </form>
      </div>
    </div>
  </main>
</div>
