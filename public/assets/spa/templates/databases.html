<aside data-component="sidebar"></aside>
<div class="main-content">
  <header data-component="topbar"></header>
  <div data-component="mode-banner"></div>
  <div data-component="rollback-bar"></div>
  <main class="content" data-component="api" data-endpoint="/api/v2/session">
    <div class="card-groups">
      <header>
        <div>
          <h1 class="icon-database" data-i18n>Databases</h1>
          <p data-i18n>MariaDB databases and their users</p>
        </div>
        <div class="header-actions">
          <button type="button" class="btn icon-database" data-action="click.prevent:openPhpMyAdmin" data-i18n>Open phpMyAdmin</button>
          <button type="button" class="btn btn-primary icon-plus" data-if="permissions['db.manage']" data-action="click.prevent:requestApi"
                  data-api-url="/api/v2/databases/form" data-api-method="get" data-i18n>Add database</button>
        </div>
      </header>
      <div class="content-body">
        <div class="tablebody">
          <table class="table border fullwidth" data-table="databases" data-source="/api/v2/databases" data-default-sort="name asc" data-page-size="25" data-search-columns="name"
                 data-row-actions='{
                   "delete": {
                     "title": "Delete",
                     "className": "btn btn-danger icon-delete",
                     "method": "delete",
                     "url": "/api/v2/databases/{name}",
                     "params": {"confirm": "{name}", "drop_user": "1"},
                     "condition": "${can_manage}",
                     "confirm": "Permanently delete this database and its data?"
                   }
                 }'>
            <thead>
              <tr>
                <th data-field="name" data-cell-class="mono" data-i18n>{LNG_Name}</th>
                <th data-field="size" data-format="bytes" class="center" data-cell-class="center" data-i18n>{LNG_Size}</th>
                <th data-field="charset" class="center" data-cell-class="center" data-empty-text="—" data-i18n>{LNG_Charset}</th>
                <th data-field="site" data-empty-text="—" data-i18n>{LNG_Website}</th>
                <!--
                  A database the panel knows about but MariaDB no longer has —
                  this must be visible in the table itself, not discovered
                  only after clicking backup and getting a raw mysqldump error.
                -->
                <th data-field="status" class="center" data-cell-class="center"
                    data-template="<span class='pill pill-${status_tone}'>${status_label}</span>" data-i18n>{LNG_Status}</th>
                <!--
                  The "Open phpMyAdmin" button must be a formatter, not a
                  `data-row-actions` entry.

                  Opening it is two steps that can't be split apart: a POST
                  carrying a CSRF token to create a session on phpMyAdmin's
                  side (auth_type = signon), then navigating to the URL that
                  returns · `data-row-actions` (which can only build a single
                  link or request) can't do this. The old direct link to
                  `/phpmyadmin/index.php?...` was a bare GET with no session,
                  so the user landed on phpMyAdmin's own login screen instead
                  of their own database — the "clicked the table button and
                  nothing happened" symptom.

                  Tied to `exists_on_server` because the button should only
                  appear for a database that genuinely exists on MariaDB — a
                  row the panel still knows about but the machine no longer
                  has would just lead to phpMyAdmin's own error page (and the
                  `name` column is already used for the database name, so the
                  same table can't have a duplicate data-field).
                -->
                <th data-field="exists_on_server" data-formatter="formatDatabaseActions" data-i18n>{LNG_Open}</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
