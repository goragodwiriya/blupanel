<div class="config-file">
  <div class="alert alert-warning" data-i18n>Saving replaces every record at once — records you delete from the text are deleted for real. Check the whole list before saving, not just the lines you changed.</div>

  <form data-form="zoneRecords" data-attr="action:form_action" method="post" data-method="PUT"
        data-ajax-submit="true" data-reload-table="dnsRecords"
        data-confirm="Replace every DNS record for this domain with what is written here?">
    <fieldset>
      <div>
        <span class="form-control">
          <textarea name="content" rows="18" spellcheck="false" autocomplete="off"
                    class="mono config-file-editor" data-attr="value:content"></textarea>
        </span>
      </div>
    </fieldset>
    <fieldset class="submit">
      <button type="submit" class="btn btn-primary icon-save" data-loading-text="Checking..." data-i18n>Save and test</button>
    </fieldset>
  </form>
</div>
