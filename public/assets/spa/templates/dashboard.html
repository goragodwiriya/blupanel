<aside data-component="sidebar"></aside>
<div class="main-content">
  <header data-component="topbar"></header>
  <div data-component="mode-banner"></div>
  <div data-component="rollback-bar"></div>
  <main class="content">
    <div class="card-groups" data-component="api" data-endpoint="/api/v2/dashboard" data-refresh-event="phpcp:reload">
      <header>
        <div>
          <h1 class="icon-dashboard" data-i18n>Dashboard</h1>
          <p data-i18n>Server and hosting overview</p>
        </div>
        <div class="header-actions">
          <button type="button" class="btn is-loading icon-refresh" data-action="click.prevent:emit" data-emit-event="phpcp:reload" data-i18n>Refresh</button>
        </div>
      </header>
      <div class="ggrid">
        <div class="block3 large6 stat-card">
          <div class="stat-header icon-meter"><span data-i18n>CPU</span></div>
          <div class="stat-value"><span data-text="metrics.cpu.percent | fixed">—</span>%</div>
          <div class="meter"><span data-style="width: {{metrics.cpu.percent}}%"></span></div>
        </div>
        <div class="block3 large6 stat-card">
          <div class="stat-header icon-database"><span data-i18n>Memory</span></div>
          <div class="stat-value">
            <span data-text="metrics.memory.used | bytes">—</span> / <span data-text="metrics.memory.total | bytes">—</span>
          </div>
          <div class="meter"><span data-style="width: {{metrics.memory.percent}}%"></span></div>
        </div>
        <div class="block3 large6 stat-card">
          <div class="stat-header icon-stack"><span data-i18n>Disk</span></div>
          <div class="stat-value">
            <span data-text="metrics.disk.used | bytes">—</span> / <span data-text="metrics.disk.total | bytes">—</span>
          </div>
          <div class="meter"><span data-style="width: {{metrics.disk.percent}}%"></span></div>
        </div>
        <div class="block3 large6 stat-card">
          <div class="stat-header icon-clock"><span data-i18n>Uptime</span></div>
          <div class="stat-value" data-text="metrics.uptime.seconds | duration">—</div>
          <div class="stat-sub">
            <span data-i18n>Load average</span>: <span data-text="metrics.load['1'] | fixed:2">—</span> · <span data-text="metrics.load['5'] | fixed:2">—</span> · <span
                  data-text="metrics.load['15'] | fixed:2">—</span>
          </div>
        </div>
      </div>
      <div class="ggrid">
        <a class="block3 large6 stat-card" href="/app/sites" data-route="/sites">
          <div class="stat-header icon-website"><span data-i18n>Websites</span></div>
          <div class="stat-value" data-text="counts.sites">0</div>
        </a>
        <a class="block3 large6 stat-card" href="/app/domains" data-route="/domains">
          <div class="stat-header icon-link"><span data-i18n>Domains</span></div>
          <div class="stat-value" data-text="counts.domains">0</div>
        </a>
        <a class="block3 large6 stat-card" href="/app/databases" data-route="/databases">
          <div class="stat-header icon-database"><span data-i18n>Databases</span></div>
          <div class="stat-value" data-text="counts.databases">0</div>
        </a>
        <a class="block3 large6 stat-card" href="/app/certificates" data-route="/certificates">
          <div class="stat-header icon-lock"><span data-i18n>SSL Certificates</span></div>
          <div class="stat-value" data-text="counts.certificates">0</div>
        </a>
        <a class="block3 large6 stat-card" href="/app/php-versions" data-route="/php-versions">
          <div class="stat-header icon-code"><span data-i18n>PHP versions in use</span></div>
          <div class="stat-value" data-text="counts.php_versions">0</div>
        </a>
        <a class="block3 large6 stat-card" href="/app/backups" data-route="/backups">
          <div class="stat-header icon-stack"><span data-i18n>Backups</span></div>
          <div class="stat-value" data-text="counts.backups">0</div>
        </a>
      </div>
      <div class="ggrid">
        <section class="block6" data-if="services.length > 0">
          <h2 class="icon-stats" data-i18n>Services</h2>
          <div class="service-cards" data-for="service in services">
            <template>
              <div data-attr="class:'service-card is-' + service.status_tone">{{service.label}}</div>
            </template>
          </div>
        </section>
        <section class="block6" data-if="activity.length > 0">
          <h2 class="icon-list" data-i18n>Recent activity</h2>
          <div class="activity-cards" data-for="item in activity">
            <template>
              <div data-attr="class:'activity-card card-' + item.result_tone">
                <div class="flex middle justify-between">
                  <span data-attr="class:'activity-time is-' + item.result_tone" data-text="item.ts" data-formatter="datetime"></span>
                  <span data-attr="class:'pill pill-' + item.result_tone">{{item.result_label}}</span>
                </div>
                <div class="flex middle justify-between">
                  <div class="activity-actor" data-text="'{LNG_User} ' + item.actor_name"></div>
                  <div class="mono" data-text="item.target"></div>
                  
                </div>
                <div class="activity-action mono">{{item.action}}</div>
              </div>
            </template>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
