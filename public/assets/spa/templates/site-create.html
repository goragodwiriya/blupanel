<aside data-component="sidebar"></aside>
<div class="main-content">
  <header data-component="topbar"></header>
  <div data-component="mode-banner"></div>
  <div data-component="rollback-bar"></div>
  <main class="content">
    <div class="card-groups">
      <header>
        <div>
          <h1 class="icon-website" data-i18n>Add website</h1>
          <p data-i18n>One website = one system user + one FPM pool</p>
        </div>
        <div class="header-actions">
          <a class="btn icon-arrow-left" href="/app/sites" data-route="/sites" data-i18n>Websites</a>
        </div>
      </header>
      <div class="content-body">
        <!-- `data-load-query-params` forwards this page's own query string into
             the defaults request, so `/app/site-create?owner=7` opens with that
             account already chosen · that is the link the user page uses, and
             without it an admin arriving from a customer with no website had to
             find the right name again in a list of every hosting account -->
        <form data-form="siteCreate" data-validate="true" data-reset="true" action="/api/v2/sites" method="post" data-ajax-submit="true" data-load-api="/api/v2/sites/0"
              data-load-query-params="true" autocomplete="off">
          <fieldset>
            <div>
              <label for="new_owner_user_id" data-i18n>Owner</label>
              <span class="form-control icon-user">
                <select id="new_owner_user_id" name="owner_user_id" data-options-key="owner_user_id" data-attr="value:owner_user_id">
                </select>
              </span>
            </div>
            <div class="form-group">
              <div class="width50">
                <label for="new_domain" data-i18n>Domain</label>
                <span class="form-control icon-website">
                  <!-- The rule is stated here as well as at `Validator::domain()`, so a
                       mistyped name is caught **in the box it was typed into** · both this
                       field and Aliases below reach the same server-side validator, which
                       answers with one message naming neither — an admin who pasted a URL
                       was told "invalid domain" while looking at a box that read fine -->
                  <input type="text" id="new_domain" name="domain" required maxlength="253" placeholder="example.com" autocomplete="off"
                         pattern="^[A-Za-z0-9]([A-Za-z0-9\-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9\-]{0,61}[A-Za-z0-9])?)+$" data-error-pattern="Use a name like example.com — letters, digits and -, with at least one dot, and nothing else (no http://, no port, no path)">
                </span>
              </div>
            </div>
            <div class="form-group" data-if="has_pointer_roots">
              <div class="width50">
                <label for="new_pointer_root" data-i18n>Parent folder</label>
                <span class="form-control icon-folder">
                  <select id="new_pointer_root" name="pointer_root" data-options-key="pointer_root">
                  </select>
                </span>
              </div>
              <div class="width50">
                <label for="new_docroot" data-i18n>Document Root</label>
                <span class="form-control icon-folder">
                  <input type="text" id="new_docroot" name="docroot" maxlength="100" placeholder="my-project" autocomplete="off">
                </span>
                <div class="comment" id="result_new_docroot" data-i18n>Leave empty to use the default location</div>
              </div>
            </div>
            <div class="form-group">
              <div class="width50">
                <label for="new_php" data-i18n>PHP version</label>
                <span class="form-control icon-code">
                  <select id="new_php" name="php_version" data-options-key="php_version">
                  </select>
                </span>
              </div>
              <div class="width50">
                <label for="new_aliases" data-i18n>{LNG_Aliases}/{LNG_Domain Pointer}</label>
                <span class="form-control icon-link">
                  <input type="text" id="new_aliases" name="aliases" autocomplete="off" placeholder="www.example.com"
                         pattern="^\s*[A-Za-z0-9]([A-Za-z0-9\-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9\-]{0,61}[A-Za-z0-9])?)+([\s,]+[A-Za-z0-9]([A-Za-z0-9\-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9\-]{0,61}[A-Za-z0-9])?)+)*\s*$" data-error-pattern="Each name must look like www.example.com — separate several with a space or comma, and nothing else (no http://, no port, no path)">
                </span>
                <div class="comment" id="result_new_aliases" data-i18n>Separate multiple names with a space or comma</div>
              </div>
            </div>
          </fieldset>
          <fieldset class="submit">
            <button type="submit" class="btn btn-primary icon-save" data-i18n>Add website</button>
          </fieldset>
        </form>
      </div>
    </div>
  </main>
</div>
