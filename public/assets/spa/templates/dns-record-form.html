<!--
  ฟอร์มเพิ่มเรกคอร์ด DNS — คนละเทมเพลตกับตารางตาม FRAMEWORK_GUIDE Pattern 3

  ปลายทางมาจากคำตอบของ API (`form_action`) ไม่ใช่เขียนตายไว้ในไฟล์ เพราะขึ้นกับว่า
  กำลังดูโดเมนไหนอยู่ · เทมเพลตนี้ถูกโหลดตอนกดปุ่ม จึงไม่ผ่านการแทนค่า `{id}` ของ
  RouterManager ที่ทำให้ HTML ของหน้าใช้ `{id}` ได้

  ไม่มีฟอร์มแก้ไขคู่กัน เพราะเรกคอร์ดแก้ไม่ได้ — ลบแล้วเพิ่มใหม่เสมอ
-->
<form data-form="dnsRecord"
      data-attr="action:form_action"
      method="post"
      data-ajax-submit="true"
      data-validate="true">
  <fieldset>
    <div class="form-group">
      <div class="width50">
        <label for="rec_type" data-i18n>Type</label>
        <!--
          **ช่องพิมพ์ได้ ไม่ใช่รายการปิด** — รายการที่เลือกไว้ล่วงหน้าตกหล่นเสมอ (TLSA,
          SSHFP, DS, HTTPS/SVCB) และคนที่เจอชนิดที่ขาดต้องรอโค้ดใหม่ · ตัวเลือกยังมีให้
          เลือกตามปกติ แต่พิมพ์ชนิดอื่นได้ด้วย และ `named-checkzone` เป็นคนตัดสินว่าใช้ได้ไหม
        -->
        <span class="form-control">
          <input type="text" id="rec_type" name="type" required list="rec_types" maxlength="15"
                 autocomplete="off" spellcheck="false" class="mono" data-attr="value:type">
          <datalist id="rec_types">
            <option value="A"></option>
            <option value="AAAA"></option>
            <option value="CNAME"></option>
            <option value="MX"></option>
            <option value="TXT"></option>
            <option value="SRV"></option>
            <option value="NS"></option>
            <option value="CAA"></option>
            <option value="TLSA"></option>
            <option value="SSHFP"></option>
            <option value="HTTPS"></option>
          </datalist>
        </span>
      </div>
      <div class="width50">
        <label for="rec_ttl" data-i18n>TTL</label>
        <span class="form-control icon-clock">
          <input type="number" id="rec_ttl" name="ttl" min="0" max="604800" data-attr="value:ttl">
        </span>
      </div>
    </div>
    <div>
      <label for="rec_name" data-i18n>Name</label>
      <span class="form-control icon-link">
        <input type="text" id="rec_name" name="name" required maxlength="253"
               autocomplete="off" data-attr="value:name">
      </span>
    </div>
    <div>
      <label for="rec_value" data-i18n>Value</label>
      <span class="form-control icon-edit">
        <input type="text" id="rec_value" name="value" required maxlength="4096"
               autocomplete="off" data-attr="value:value">
      </span>
    </div>
  </fieldset>
  <fieldset class="submit right">
    <button type="submit" class="btn btn-primary icon-save" data-i18n>Add</button>
  </fieldset>
</form>
