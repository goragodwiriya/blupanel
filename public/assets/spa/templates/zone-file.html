<div class="config-file">
  <p class="config-file-path mono" data-text="path"></p>
  <p class="muted" data-text="source_label"></p>
  <div data-if="no_file">
    <div class="alert alert-warning" data-i18n>This domain has no zone file on the server yet. That is normal when the BIND9 link is switched off, or when no DNS record has been
      saved since it was switched on. What you see below is built from the records in the panel — it is what the file would contain.</div>
  </div>
  <div class="alert alert-warning" data-if="drift" data-text="drift_reason"></div>
  <pre class="mono config-file-view" data-text="content"></pre>
</div>
