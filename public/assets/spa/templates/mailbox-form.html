<form data-form="mailbox" action="/api/v2/mailboxes" method="post" data-ajax-submit="true" data-reload-table="mailboxes" data-validate="true">
  <fieldset>
    <div data-show="id === 0">
      <label for="mb_local" data-i18n>Address</label>
      <div class="form-group">
        <div class="width50">
          <span class="form-control icon-user">
            <input type="text" id="mb_local" name="local_part" maxlength="64" autocomplete="off" placeholder="sales" data-attr="value:local_part">
          </span>
        </div>
        <div class="width50">
          <span class="form-control icon-mention">
            <select id="mb_domain" name="domain" data-for="d in domains" data-value="domain">
              <template>
                <option data-attr="value:d.domain" data-text="d.domain"></option>
              </template>
            </select>
          </span>
        </div>
      </div>
      <div class="comment" data-i18n>Letters, digits, dot, underscore, plus and dash only</div>
    </div>
    <div data-show="id > 0">
      <label data-i18n>Address</label>
      <p class="mono" data-text="address"></p>
    </div>
    <!-- Prefilled on the create form, blank on the edit form — the server
         decides which, because "blank means leave the password alone" is a rule
         about mailboxes, not about this screen -->
    <div class="form-group bottom">
      <div class="width90">
        <label for="mb_password" data-i18n>Password</label>
        <span class="form-control icon-lock">
          <input type="text" id="mb_password" name="password" maxlength="128" autocomplete="off" spellcheck="false" data-attr="value:suggested_password">
        </span>
      </div>
      <div>
        <button type="button" class="btn fullwidth icon-refresh" data-action="click.prevent:suggestPassword" data-password-target="mb_password" data-i18n>Generate a new
          one</button>
      </div>
      <div>
        <button type="button" class="btn fullwidth icon-copy" data-action="click.prevent:copyField" data-copy-target="mb_password" data-i18n>Copy</button>
      </div>
    </div>
    <div class="comment" data-show="id === 0" data-i18n>Copy it before saving — only a hash is stored, so it cannot be read back later</div>
    <div class="comment" data-show="id > 0" data-i18n>Leave blank to keep the current password</div>
    <div>
      <label for="mb_quota" data-i18n>Quota (MB)</label>
      <span class="form-control icon-stack">
        <input type="number" id="mb_quota" name="quota_mb" min="1" max="102400" data-attr="value:quota_mb">
      </span>
      <div class="comment" data-i18n>Mail is refused while the mailbox is full, so the sender knows it did not arrive</div>
    </div>
  </fieldset>
  <fieldset class="submit right">
    <button type="submit" class="btn btn-primary icon-save" data-i18n>Save</button>
    <input type="hidden" name="id" data-attr="value:id">
  </fieldset>
</form>
