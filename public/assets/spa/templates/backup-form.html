<form data-form="backupCreate" action="/api/v2/backups" method="post" data-ajax-submit="true" data-validate="true">
  <fieldset>
    <div>
      <label for="nb_type" data-i18n>Type</label>
      <span class="form-control icon-menus">
        <select id="nb_type" name="type" required data-value="type">
          <option value="site" data-i18n>Website files</option>
          <option value="database" data-i18n>Database</option>
        </select>
      </span>
    </div>
    <div data-component="api" data-endpoint="/api/v2/sites">
      <label for="nb_site" data-i18n>Website</label>
      <div class="comment" data-i18n>The file goes into this website owner's backup folder</div>
      <span class="form-control icon-website">
        <select id="nb_site" name="site_id" required data-for="site in data" data-value="site_id">
          <template>
            <option data-attr="value:site.id" data-text="site.domain"></option>
          </template>
        </select>
      </span>
    </div>
    <div>
      <label for="nb_db" data-i18n>Database name</label>
      <span class="form-control icon-database">
        <input type="text" id="nb_db" name="database" maxlength="64" autocomplete="off" data-attr="value:database">
      </span>
      <div class="comment" data-i18n>Leave empty when the website has only one database</div>
    </div>
  </fieldset>
  <fieldset class="submit right">
    <button type="submit" class="btn btn-primary icon-save" data-i18n>Create backup</button>
  </fieldset>
</form>
