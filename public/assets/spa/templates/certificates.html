<aside data-component="sidebar"></aside>
<div class="main-content">
  <header data-component="topbar"></header>
  <div data-component="mode-banner"></div>
  <div data-component="rollback-bar"></div>
  <main class="content">
    <div class="card-groups">
      <header>
        <div>
          <h1 class="icon-lock" data-i18n>SSL Certificates</h1>
          <p data-i18n>Issue, renew and remove certificates per website</p>
        </div>
      </header>

      <div class="content-body">
        <div class="tablebody">
          <table class="table border fullwidth"
                 data-table="certificates"
                 data-source="/api/v2/certificates"
                 data-page-size="50"
                 data-row-actions='{
                   "issue": {
                     "title": "Issue",
                     "className": "btn btn-sm btn-primary icon-plus",
                     "method": "post",
                     "url": "/api/v2/certificates",
                     "params": {"site_id": "{site_id}", "method": "letsencrypt"},
                     "condition": "${can_manage && status === \"none\"}",
                     "confirm": "Issue a free TLS certificate for this website?"
                   },
                   "renew": {
                     "title": "Renew",
                     "className": "btn btn-sm btn-primary icon-refresh",
                     "method": "post",
                     "url": "/api/v2/certificates/{site_id}/renewal",
                     "condition": "${can_manage && status !== \"none\"}",
                     "confirm": "Renew the certificate for this website now?"
                   },
                   "delete": {
                     "title": "Remove",
                     "className": "btn btn-sm btn-danger icon-delete",
                     "method": "delete",
                     "url": "/api/v2/certificates/{site_id}",
                     "condition": "${can_manage && status !== \"none\"}",
                     "confirm": "Remove this certificate? The website falls back to plain HTTP."
                   }
                 }'>
            <thead>
              <tr>
                <th data-field="domain" data-cell-class="mono" data-i18n>{LNG_Domain}</th>
                <th data-field="ssl_mode" class="center" data-cell-class="center" data-i18n>{LNG_Mode}</th>
                <th data-field="status" class="center" data-cell-class="center"
                    data-template="<span class='pill pill-${status_tone}'>{LNG_${status}}</span>"
                    data-i18n>{LNG_Status}</th>
                <th data-field="issuer" data-empty-text="—" data-i18n>{LNG_Issuer}</th>
                <th data-field="expires_at" class="center" data-cell-class="center"
                    data-format="date" data-empty-text="—" data-i18n>{LNG_Expires}</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
