<form data-form="userSftpPassword"
      data-attr="action:form_action"
      method="post"
      data-method="PUT"
      data-ajax-submit="true"
      data-validate="true"
      data-emit-event="phpcp:reload">
  <fieldset>
    <!-- `type="text"`, not `password` — this is a credential being handed over,
         not one being re-entered · the admin has to read it off the screen to
         pass it on, and a row of dots is exactly the wrong shape for that -->
    <div>
      <label for="sftp_password" data-i18n>Password</label>
      <span class="form-control icon-lock">
        <input type="text" id="sftp_password" name="password" required minlength="12"
               autocomplete="off" spellcheck="false" data-attr="value:suggested_password">
      </span>
      <div class="flex middle gap-4">
        <button type="button" class="btn small icon-refresh" data-action="click.prevent:suggestPassword"
                data-password-target="sftp_password" data-i18n>Generate a new one</button>
        <button type="button" class="btn small icon-copy" data-action="click.prevent:copyField"
                data-copy-target="sftp_password" data-i18n>Copy</button>
      </div>
      <div class="comment" data-i18n>At least 12 characters. Shown to the customer only once — the panel never stores it in readable form.</div>
    </div>
  </fieldset>
  <fieldset class="submit">
    <button type="submit" class="btn btn-primary icon-save" data-i18n>Save password</button>
  </fieldset>
</form>
