<!--
  ตั้งรหัสผ่าน SFTP — เปิดใน Modal ตาม FRAMEWORK_GUIDE Pattern 3

  ช่องเดียว จึงไม่ควรกินที่อยู่ในหน้าตลอดเวลา · ฟอร์มเดียวกันใช้ทั้งเปิดครั้งแรกและ
  เปลี่ยนรหัสผ่าน เพราะในทางเทคนิคเป็นการกระทำเดียวกัน (PUT ตั้งค่าทั้งชุด ตาม §4.1)
  — ปลายทางกับหัวเรื่องมาจากคำตอบของ API ซึ่งรู้ว่ากำลังเปิดครั้งแรกหรือเปลี่ยน
-->
<form data-form="userSftpPassword"
      data-attr="action:form_action"
      method="post"
      data-method="PUT"
      data-ajax-submit="true"
      data-validate="true"
      data-emit-event="phpcp:reload">
  <fieldset>
    <div>
      <label for="sftp_password" data-i18n>Password</label>
      <span class="form-control icon-lock">
        <input type="password" id="sftp_password" name="password" required minlength="12"
               autocomplete="new-password" spellcheck="false">
      </span>
      <div class="comment" data-i18n>At least 12 characters. Shown to the customer only once — the panel never stores it in readable form.</div>
    </div>
  </fieldset>
  <fieldset class="submit">
    <button type="submit" class="btn btn-primary icon-save" data-i18n>Save password</button>
  </fieldset>
</form>
